# Production topology: a real Qdrant server, not the embedded local mode
# used for local dev/testing. Local mode's SQLite-backed storage is NOT the
# same on-disk format as the server — you cannot copy
# data/full_index/qdrant into cloudrun-data/qdrant below.
#
# cloudrun-data/ is the real, complete index (964,603 Hindi validation
# chunks, index version full1) — the same artifact baked into
# Dockerfile.cloudrun for deployment. This is the main index: mounted
# directly rather than duplicated, so local Compose and the deployed
# container serve identical data.

services:
  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      # Keep the vector database off the public network. The app reaches it
      # over Docker's private network; the host can still run index tooling.
      - "127.0.0.1:6333:6333"
    volumes:
      - ./cloudrun-data/qdrant:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - VOICE_RAG_MANAGED_QDRANT=0
      - QDRANT_URL=http://qdrant:6333
      - BM25_PATH=/app/cloudrun-data/bm25
      - VOICE_RAG_LANGUAGE=hi
      - VOICE_RAG_INDEX_VERSION=full1
    env_file:
      - .env  # SARVAM_API_KEY — never baked into the image
    volumes:
      - ./cloudrun-data/bm25:/app/cloudrun-data/bm25  # portable Tantivy index, safe to mount directly
    depends_on:
      - qdrant
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
