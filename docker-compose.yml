# Production topology (docs/08-repo-and-stack.md): a real Qdrant server,
# not the embedded local mode used for local dev/testing. Verified directly
# (docs/evaluation-results.md) that local mode's SQLite-backed storage is
# NOT the same on-disk format as the server — you cannot copy
# data/full_index/qdrant into qdrant_storage below. Populate it by running
# scripts/build_full_index.py --qdrant-url http://localhost:6333 against
# this running stack instead (see docs/runpod-deployment.md).

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - BM25_PATH=/app/data/full_index/bm25/hi_validation
      - VOICE_RAG_LANGUAGE=hi
      - VOICE_RAG_INDEX_VERSION=full1
      - VOICE_RAG_GENERATION_BACKEND=gemini
    env_file:
      - .env  # SARVAM_API_KEY / ANTHROPIC_API_KEY / GEMINI_API_KEY — never baked into the image
    volumes:
      - ./data/full_index/bm25:/app/data/full_index/bm25  # portable Tantivy index, safe to mount directly
    depends_on:
      - qdrant
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  qdrant_storage:
