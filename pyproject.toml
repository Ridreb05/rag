[project]
name = "voice-rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Debanik", email = "136997808+Ridreb05@users.noreply.github.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets>=5.0.1",
    "fastapi[standard]>=0.141.1",
    "flagembedding>=1.4.0",
    "fsspec>=2026.6.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.27.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.19.0",
    "tantivy>=0.26.0",
    "torch==2.6.0+cu118",
    "tqdm>=4.70.0",
]

[project.scripts]
voice-rag = "voice_rag:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
# Pinned to CUDA 11.8 for broad RunPod GPU-driver compatibility. The exact
# local-version pin prevents uv from selecting a CPU-only PyPI wheel.
# `explicit = true` keeps this index from resolving unrelated packages.
torch = { index = "pytorch-cu118" }

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: loads real ML models (BGE-M3, reranker, NLI) — needs GPU/network/model downloads; run explicitly with `-m slow`",
]
